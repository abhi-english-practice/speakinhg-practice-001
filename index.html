<!doctype html>
<html lang="en">
<head>

  <title>SpeakPop — IELTS Part 2 Dossier</title>
  <style>
    :root{--ink:#17131f;--paper:#fffaf0;--pink:#ff4f9a;--yellow:#ffd84d;--blue:#78d7ff;--lime:#b7ee58;--purple:#a783ff;--line:3px solid var(--ink);--shadow:6px 6px 0 var(--ink)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-image:radial-gradient(#17131f18 1px,transparent 1px);background-size:18px 18px}
    button,input{font:inherit}button{color:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.topbar{position:sticky;top:0;z-index:20;border-bottom:var(--line);background:#fffdf7e8;backdrop-filter:blur(12px)}.topbar .shell{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:950;font-size:1.2rem;letter-spacing:-.04em}.brand span{background:var(--pink);padding:2px 7px;border:2px solid var(--ink);transform:rotate(-2deg);display:inline-block}.meter{display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:800}.track{width:150px;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}.fill{height:100%;width:0;background:var(--lime);transition:.25s}
    header{padding:48px 0 28px}.eyebrow{display:inline-block;background:var(--yellow);border:var(--line);box-shadow:4px 4px 0 var(--ink);padding:5px 10px;font-weight:900;transform:rotate(-1deg)}h1{font-size:clamp(2.6rem,8vw,6.8rem);line-height:.86;letter-spacing:-.075em;margin:22px 0 18px;max-width:1000px}h1 i{font-family:Georgia,serif;font-weight:400;color:var(--pink)}.lede{max-width:660px;font-size:1.08rem;font-weight:650;margin:0}
    .topics{display:flex;gap:10px;overflow:auto;padding:10px 0 28px;scrollbar-width:none}.topics::-webkit-scrollbar{display:none}.topic-btn{white-space:nowrap;border:2px solid var(--ink);background:#fff;border-radius:99px;padding:10px 16px;font-weight:850;cursor:pointer}.topic-btn.active,.topic-btn:hover{background:var(--ink);color:#fff}
    main{padding-bottom:70px}.dossier{display:none}.dossier.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:20px}.card{border:var(--line);background:#fff;box-shadow:var(--shadow);padding:clamp(18px,3vw,30px);margin-bottom:20px}.card.pink{background:#ffd3e6}.card.blue{background:#d9f2ff}.card.yellow{background:#fff0a6}.card.lime{background:#e4ffad}.label{font-size:.76rem;font-weight:950;text-transform:uppercase;letter-spacing:.12em}.card h2,.card h3{line-height:1.05;letter-spacing:-.04em;margin:10px 0 16px}.card h2{font-size:clamp(1.8rem,4vw,3rem)}.card h3{font-size:1.45rem}.cue{margin:0;padding-left:20px}.cue li{margin:8px 0}.vi{color:#5d5666;font-size:.92em}.bank{display:flex;flex-wrap:wrap;gap:9px}.chip{border:2px solid var(--ink);background:#fff;padding:7px 10px;border-radius:8px;font-weight:850;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}.chip.used{opacity:.35;box-shadow:none}.passage{font-size:1.04rem}.gap{display:inline-block;min-width:92px;border-bottom:3px solid var(--pink);color:#8c2352;font-weight:900;text-align:center;cursor:pointer}.collocation{font-weight:950;background:linear-gradient(transparent 58%,#ffd84d 58%)}.tough{font-weight:900;text-decoration:underline;text-decoration-color:var(--purple);text-decoration-thickness:3px;text-underline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.action{border:2px solid var(--ink);background:#fff;padding:10px 14px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}.action.primary{background:var(--ink);color:#fff}.action:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.translation{display:none;border-top:2px dashed var(--ink);margin-top:18px;padding-top:16px}.translation.show{display:block}.timer{text-align:center}.clock{font-size:3.7rem;font-weight:950;letter-spacing:-.06em;margin:14px 0}.tips{display:grid;gap:9px}.tip{border-left:6px solid var(--pink);padding:7px 10px;background:#fff}.score{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.check{display:flex;gap:8px;align-items:flex-start;background:#fff;border:2px solid var(--ink);padding:10px;cursor:pointer}.check input{accent-color:var(--pink);margin-top:5px}
    footer{border-top:var(--line);padding:28px 0 45px;background:var(--ink);color:#fff}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem}.swatch{display:inline-block;width:18px;height:12px;margin-right:6px}.s1{background:var(--yellow)}.s2{border-bottom:3px solid var(--purple)}
    @media(max-width:780px){.grid{grid-template-columns:1fr}.meter span{display:none}.track{width:95px}header{padding-top:34px}.card{box-shadow:4px 4px 0 var(--ink)}h1{font-size:3.6rem}.score{grid-template-columns:1fr}}
  </style>

  <header class="shell"><div class="eyebrow">IELTS SPEAKING • PART 2</div><h1>THE SOCIAL<br><i>ISSUES</i> DOSSIER</h1><p class="lede">Four bold topics. Bilingual support. Real speaking practice at Band 6.0 level.</p></header>

<script>
const lessons=[
{id:'whitewashing',title:'Corporate Whitewashing',no:'01',color:'pink',prompt:'Describe an example of corporate whitewashing that you have heard about.',promptVi:'Mô tả một trường hợp doanh nghiệp che giấu hoặc làm nhẹ sự thật tiêu cực mà bạn từng nghe.',cues:[['What the company did','Công ty đã làm gì'],['How people discovered the truth','Mọi người phát hiện sự thật thế nào'],['What happened afterward','Điều gì xảy ra sau đó'],['How you felt about it','Cảm nhận của bạn']],words:[['reliable colleague','đồng nghiệp đáng tin cậy'],['buy online','mua hàng trực tuyến'],['precise measurement','phép đo chính xác'],['allow access','cho phép truy cập'],['stubborn person','người cố chấp'],['face the consequences','đối mặt hậu quả'],['huge amount','khoản tiền rất lớn'],['brief interruption','sự gián đoạn ngắn'],['seldom visit','hiếm khi ghé thăm'],['relieve the damage','giảm bớt tổn hại']],parts:['I learned about an eco-friendly advertising scandal from a ',' who works in marketing. The company encouraged people to ',' because it claimed to produce almost no waste. An independent group requested a ',' of its ','. The company initially refused to ',' to production data, and its director behaved like a ','. When the truth became public, it had to ',' and paid a ',' in fines. The scandal caused a ',' to business. I now ',' its stores, although its new policies may help ',' it caused.'],answers:['reliable colleague','buy online','precise measurement','carbon emissions','allow access','stubborn person','face the consequences','huge amount','brief interruption','seldom visit','relieve the damage'],tough:{'carbon emissions':'lượng khí thải carbon'},vi:'Tôi biết về một vụ bê bối quảng cáo thân thiện với môi trường từ một đồng nghiệp đáng tin cậy làm trong ngành tiếp thị. Công ty khuyến khích mọi người mua hàng trực tuyến vì tuyên bố gần như không tạo ra rác thải. Một tổ chức độc lập yêu cầu đo chính xác lượng khí thải carbon. Ban đầu công ty từ chối cung cấp dữ liệu sản xuất và giám đốc hành xử khá cố chấp. Khi sự thật được công khai, công ty phải đối mặt hậu quả và nộp khoản tiền phạt rất lớn. Vụ việc làm kinh doanh gián đoạn. Hiện tôi hiếm khi ghé cửa hàng của họ, dù các chính sách mới có thể giảm bớt tổn hại.'},
{id:'bullying',title:'Bullying at School',no:'02',color:'blue',prompt:'Describe a situation in which someone took action against bullying.',promptVi:'Mô tả một tình huống trong đó có người đã hành động chống lại nạn bắt nạt.',cues:[['Where it happened','Sự việc xảy ra ở đâu'],['Who was involved','Những ai liên quan'],['What action was taken','Biện pháp đã thực hiện'],['What you learned','Điều bạn học được']],words:[['pay attention','chú ý'],['highly qualified','có chuyên môn cao'],['take action','hành động'],['postpone a meeting','hoãn cuộc họp'],['heavy rain','mưa lớn'],['strong argument','lập luận thuyết phục'],['reach an agreement','đạt thỏa thuận'],['gain experience','tích lũy kinh nghiệm'],['make progress','có tiến triển'],['meet requirements','đáp ứng yêu cầu']],parts:['A group of students repeatedly mocked a quiet classmate. At first, teachers did not ',' because it happened outside class. A ',' counsellor noticed that the student had become ','. She decided to ',' and spoke with the students and parents. One parent had to ',' because of ','. The counsellor made a ',' about the effects on learning and mental health. The families ',' on solutions, while teachers began to ','. The situation started to ',', and the school introduced rules to ',' for student safety.'],answers:['pay attention','highly qualified','anxious','take action','postpone a meeting','heavy rain','strong argument','reached an agreement','gain experience','make progress','meet requirements'],tough:{anxious:'lo âu'},vi:'Một nhóm học sinh liên tục chế giễu một bạn trầm tính. Ban đầu giáo viên không chú ý vì việc đó xảy ra ngoài lớp. Một chuyên viên tư vấn có chuyên môn cao nhận thấy bạn ấy trở nên lo âu. Cô quyết định hành động và trao đổi với học sinh cùng phụ huynh. Một phụ huynh phải hoãn cuộc họp vì mưa lớn. Chuyên viên đưa ra lập luận thuyết phục về tác động đến học tập và sức khỏe tinh thần. Các gia đình đạt thỏa thuận về giải pháp, còn giáo viên tích lũy thêm kinh nghiệm. Tình hình bắt đầu tiến triển và trường đưa ra quy định đáp ứng yêu cầu an toàn.'},
{id:'detox',title:'Digital Detox',no:'03',color:'yellow',prompt:'Describe a time when you took a break from digital devices.',promptVi:'Mô tả một lần bạn tạm ngừng sử dụng thiết bị kỹ thuật số.',cues:[['When it happened','Việc đó xảy ra khi nào'],['Why you did it','Vì sao bạn thực hiện'],['What you did instead','Bạn làm gì thay thế'],['How you felt afterward','Cảm nhận sau đó']],words:[['sharp decrease','sự sụt giảm mạnh'],['competent manager','quản lý có năng lực'],['clear explanation','lời giải thích rõ ràng'],['reply promptly','trả lời nhanh chóng'],['refuse an offer','từ chối lời đề nghị'],['help my neighbour with','giúp hàng xóm làm'],['unpredictable weather','thời tiết khó lường'],['regular meeting','cuộc gặp thường xuyên'],['sign a contract','ký hợp đồng'],['prevent accidents','phòng tránh tai nạn']],parts:['Last summer, I tried a weekend digital detox after noticing a ',' in my concentration. My supervisor is a ',' who gave us a ',' of why we should ',' from work after hours. We did not need to ',' to non-urgent messages. I had to ',' to join an online game. Instead, I read and ',' some gardening. Despite the ',', I walked outside and later attended a ',' with friends. I did not need to ',' or make a major commitment. Putting my phone away may also ',' caused by distracted walking.'],answers:['sharp decrease','competent manager','clear explanation','disconnect','reply promptly','refuse an offer','helped my neighbour with','unpredictable weather','regular meeting','sign a contract','prevent accidents'],tough:{disconnect:'ngắt kết nối'},vi:'Mùa hè năm ngoái, tôi thử cai thiết bị số một cuối tuần sau khi nhận thấy khả năng tập trung sụt giảm mạnh. Quản lý của tôi rất có năng lực và giải thích rõ vì sao chúng tôi nên ngắt kết nối công việc ngoài giờ. Chúng tôi không cần trả lời ngay tin nhắn không khẩn cấp. Tôi từ chối lời mời chơi game trực tuyến; thay vào đó, tôi đọc sách và giúp hàng xóm làm vườn. Dù thời tiết khó lường, tôi đi bộ ngoài trời rồi gặp bạn bè. Việc này không cần ký hợp đồng hay cam kết lớn, đồng thời có thể phòng tai nạn do vừa đi vừa nhìn điện thoại.'},
{id:'doomscrolling',title:'Doomscrolling',no:'04',color:'lime',prompt:'Describe a harmful online habit that you want to change.',promptVi:'Mô tả một thói quen trực tuyến có hại mà bạn muốn thay đổi.',cues:[['What the habit is','Đó là thói quen gì'],['When you do it','Bạn thường làm khi nào'],['How it affects you','Nó ảnh hưởng ra sao'],['How you will change it','Bạn sẽ thay đổi thế nào']],words:[['closely related','liên quan chặt chẽ'],['wide range','nhiều loại đa dạng'],['side effects','tác dụng phụ'],['serious illness','bệnh nghiêm trọng'],['conduct a survey','thực hiện khảo sát'],['book a room','đặt phòng'],['raise funds','gây quỹ'],['take effect','phát huy tác dụng'],['fully prepared','chuẩn bị đầy đủ'],['apologize for a mistake','xin lỗi vì sai lầm']],parts:['Doomscrolling means continuously reading negative news. It is ',' to stress and poor sleep. Social media contains a ',' of frightening stories. This habit can have ',': poor concentration and ','. It may even make an ordinary problem feel like a ','. My university decided to ',' on students’ habits. It had to ',' for a workshop, and students helped ',' for the programme. Setting a daily limit took days to ','. I was not ',' for how difficult change would be, and sometimes had to ',' after ignoring my friends.'],answers:['closely related','wide range','side effects','anxiety','serious illness','conduct a survey','book a room','raise funds','take effect','fully prepared','apologize for a mistake'],tough:{anxiety:'sự lo âu'},vi:'Doomscrolling là việc liên tục đọc tin tiêu cực. Nó liên quan chặt chẽ đến căng thẳng và giấc ngủ kém. Mạng xã hội có nhiều tin đáng sợ, và thói quen này gây tác dụng phụ như giảm tập trung và lo âu. Nó còn khiến vấn đề bình thường có vẻ như một căn bệnh nghiêm trọng. Trường tôi từng khảo sát thói quen của sinh viên, đặt phòng cho hội thảo và gây quỹ cho chương trình. Việc giới hạn thời gian mất vài ngày mới có tác dụng. Tôi chưa chuẩn bị đầy đủ cho độ khó của thay đổi và đôi khi phải xin lỗi vì đã phớt lờ bạn bè.'}
];
const state={active:0,done:new Set(JSON.parse(localStorage.getItem('speakpopDone')||'[]')),timers:{}};
function richLesson(l){let html='';l.parts.forEach((p,i)=>{html+=p;if(i<l.answers.length){const a=l.answers[i], tough=l.tough[a];html+=`<span class="gap" data-answer="${a}" title="Tap to reveal">${i+1}</span>${tough?` <span class="tough">${tough}</span>`:''}`}});return html}
function render(){document.getElementById('topicNav').innerHTML=lessons.map((l,i)=>`<button class="topic-btn ${i===state.active?'active':''}" onclick="openTopic(${i})">${l.no} — ${l.title}</button>`).join('');document.getElementById('app').innerHTML=lessons.map((l,i)=>`<section class="dossier ${i===state.active?'active':''}" id="${l.id}"><div class="grid"><div><article class="card ${l.color}"><div class="label">Case file ${l.no}</div><h2>${l.title}</h2><b>${l.prompt}</b><p class="vi">${l.promptVi}</p><ul class="cue">${l.cues.map(c=>`<li>${c[0]} <span class="vi">— ${c[1]}</span></li>`).join('')}</ul></article><article class="card"><div class="label">Gap-fill dossier</div><h3>Build the answer</h3><div class="bank">${l.words.map(w=>`<button class="chip" title="${w[1]}">${w[0]}</button>`).join('')}</div><p class="passage">${richLesson(l)}</p><div class="actions"><button class="action primary reveal">Reveal answers</button><button class="action translate">Vietnamese</button><button class="action reset">Reset</button></div><div class="translation"><b>Bản dịch</b><p>${l.vi}</p></div></article></div><aside><article class="card timer"><div class="label">Speaking timer</div><div class="clock">02:00</div><div class="actions" style="justify-content:center"><button class="action primary timerBtn">Start</button><button class="action timerReset">Reset</button></div></article><article class="card"><div class="label">Band 6.0 toolkit</div><h3>Make it yours</h3><div class="tips"><div class="tip">I’d like to talk about…</div><div class="tip">I first learned about it when…</div><div class="tip">One particular example is…</div><div class="tip">The main effect is that…</div><div class="tip">Overall, I believe that…</div></div></article><article class="card"><div class="label">Self-check</div><h3>Ready to perform?</h3><div class="score">${['90–120 seconds','5+ collocations','One clear example','Personal opinion'].map(x=>`<label class="check"><input type="checkbox">${x}</label>`).join('')}</div><div class="actions"><button class="action primary complete">${state.done.has(i)?'Completed ✓':'Mark complete'}</button></div></article></aside></div></section>`).join('');bind();updateProgress()}
function openTopic(i){state.active=i;render();scrollTo({top:0,behavior:'smooth'})}
function bind(){const section=document.querySelector('.dossier.active'),lesson=lessons[state.active];section.querySelectorAll('.gap').forEach(g=>g.onclick=()=>{g.textContent=g.dataset.answer;g.classList.add(lesson.tough[g.dataset.answer]?'tough':'collocation')});section.querySelector('.reveal').onclick=()=>section.querySelectorAll('.gap').forEach(g=>{g.textContent=g.dataset.answer;g.classList.add(lesson.tough[g.dataset.answer]?'tough':'collocation')});section.querySelector('.translate').onclick=()=>section.querySelector('.translation').classList.toggle('show');section.querySelector('.reset').onclick=()=>section.querySelectorAll('.gap').forEach((g,i)=>{g.textContent=i+1;g.className='gap'});section.querySelector('.complete').onclick=()=>{state.done.add(state.active);localStorage.setItem('speakpopDone',JSON.stringify([...state.done]));render()};let seconds=120,tick=null,clock=section.querySelector('.clock'),btn=section.querySelector('.timerBtn');const paint=()=>clock.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;btn.onclick=()=>{if(tick){clearInterval(tick);tick=null;btn.textContent='Resume'}else{btn.textContent='Pause';tick=setInterval(()=>{if(seconds>0){seconds--;paint()}else{clearInterval(tick);tick=null;btn.textContent='Done!'}},1000)}};section.querySelector('.timerReset').onclick=()=>{clearInterval(tick);tick=null;seconds=120;paint();btn.textContent='Start'}}
function updateProgress(){const n=state.done.size;document.getElementById('progress').style.width=`${n/lessons.length*100}%`;document.getElementById('progressText').textContent=`${n}/${lessons.length}`}
render();
</script>
